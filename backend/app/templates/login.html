{% extends "base.html" %}

{% block title %}Login - Prompt Pilot{% endblock %}

{% block content %}
<h2>Login</h2>
<div id="message-container"></div>
<form id="login-form">
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
    </div>
    <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">Login</button>
</form>
<div class="auth-links">
    <p>Don't have an account? <a href="/view/register">Register here</a>.</p>
</div>
{% endblock %}

{% block scripts_extra %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Redirect if already logged in
        if (getToken()) {
            window.location.href = '/view/dashboard';
            return; // Stop further execution
        }

        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // FastAPI's OAuth2PasswordRequestForm expects form data
            const formData = new FormData();
            formData.append('username', email); // API uses 'username' field for email in this form
            formData.append('password', password);

            try {
                // Note: makeApiCall stringifies body by default if not FormData.
                // For /auth/login, it expects x-www-form-urlencoded, which FormData provides.
                const data = await makeApiCall('/auth/login', 'POST', formData, {}); // No explicit Content-Type needed for FormData
                saveToken(data.access_token);
                updateNav(); // Update nav immediately
                window.location.href = '/view/dashboard';
            } catch (error) {
                displayMessage(error.message || 'Login failed. Please check your credentials.');
            }
        });
    });
</script>
{% endblock %}
